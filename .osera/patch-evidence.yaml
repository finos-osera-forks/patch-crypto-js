      - crypto-js
    note: "New in this release; adapted onto 4.1.1: upstream's change plus pbkdf2 keeping its sha1 load, so callers that pass the old hasher still work. PBKDF2's defaults become SHA256 and 250000 iterations, as in 4.2.0, so keys derived with the old defaults need hasher: CryptoJS.algo.SHA1, iterations: 1 passed explicitly. Every file in the package is generated by upstream's grunt build from src/ at the tag."
