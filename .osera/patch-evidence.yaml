  - cve: CVE-2023-46233
    upstream_fix_url: https://github.com/brix/crypto-js/commit/421dd538b2d34e7c24a5b72cc64dc2b9167db40a
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2023-46233
